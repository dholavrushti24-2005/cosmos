<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#4a044e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#701a75" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="700" fill="url(#bgGrad)"/>
  
  <!-- Subtle Aesthetic Geometric Rings -->
  <circle cx="300" cy="310" r="180" fill="none" stroke="#701a75" stroke-width="1.5" stroke-opacity="0.15"/>
  <circle cx="300" cy="310" r="140" fill="none" stroke="#701a75" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.2"/>

  <!-- Category Tag -->
  <g transform="translate(40, 50)">
    <rect width="110" height="32" rx="16" fill="#701a75" fill-opacity="0.12"/>
    <text x="55" y="21" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#701a75" letter-spacing="1.5" text-anchor="middle" text-transform="uppercase">Fashion</text>
  </g>

  <!-- Central Card & Vector Artwork -->
  <g filter="url(#shadow)" transform="translate(100, 120)">
    <rect width="400" height="380" rx="28" fill="#ffffff" fill-opacity="0.85"/>
    <g transform="translate(200, 190)">
      <rect x="-70" y="-30" width="140" height="90" rx="12" fill="#86198f" stroke="#701a75" stroke-width="4"/>
    <path d="M-70,-30 L0,20 L70,-30 Z" fill="#a21caf" stroke="#701a75" stroke-width="3"/>
    <circle cx="0" cy="20" r="12" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="0" cy="20" r="6" fill="#e11d48"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="300" y="555" font-family="'Poppins', sans-serif" font-size="25" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-0.5">Evening Velvet Clutch</text>
  <text x="300" y="585" font-family="'Poppins', sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">Crystal Brooch Evening Bag</text>
  
  <!-- Quality Emblem -->
  <g transform="translate(300, 630)">
    <rect x="-90" y="-16" width="180" height="32" rx="16" fill="url(#primaryGrad)"/>
    <text x="0" y="5" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">✨ COSMOS LUXURY</text>
  </g>
</svg>