<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="700" fill="url(#bgGrad)"/>
  
  <!-- Subtle Aesthetic Geometric Rings -->
  <circle cx="300" cy="310" r="180" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.15"/>
  <circle cx="300" cy="310" r="140" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.2"/>

  <!-- Category Tag -->
  <g transform="translate(40, 50)">
    <rect width="110" height="32" rx="16" fill="#0284c7" fill-opacity="0.12"/>
    <text x="55" y="21" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#0284c7" letter-spacing="1.5" text-anchor="middle" text-transform="uppercase">Jewellery</text>
  </g>

  <!-- Central Card & Vector Artwork -->
  <g filter="url(#shadow)" transform="translate(100, 120)">
    <rect width="400" height="380" rx="28" fill="#ffffff" fill-opacity="0.85"/>
    <g transform="translate(200, 190)">
      <g transform="translate(-30, 0)">
      <path d="M0,-60 C12,-60 12,-40 0,-30" fill="none" stroke="#eab308" stroke-width="3"/>
      <circle cx="0" cy="-20" r="6" fill="#eab308"/>
      <line x1="0" y1="-14" x2="0" y2="15" stroke="#eab308" stroke-width="2"/>
      <ellipse cx="0" cy="35" rx="14" ry="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    </g>
    <g transform="translate(30, 0)">
      <path d="M0,-60 C12,-60 12,-40 0,-30" fill="none" stroke="#eab308" stroke-width="3"/>
      <circle cx="0" cy="-20" r="6" fill="#eab308"/>
      <line x1="0" y1="-14" x2="0" y2="15" stroke="#eab308" stroke-width="2"/>
      <ellipse cx="0" cy="35" rx="14" ry="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    </g>
    </g>
  </g>

  <!-- Typography -->
  <text x="300" y="555" font-family="'Poppins', sans-serif" font-size="25" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-0.5">Pearl Drop Earrings</text>
  <text x="300" y="585" font-family="'Poppins', sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">Freshwater Pearls & Gold Hooks</text>
  
  <!-- Quality Emblem -->
  <g transform="translate(300, 630)">
    <rect x="-90" y="-16" width="180" height="32" rx="16" fill="url(#primaryGrad)"/>
    <text x="0" y="5" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">✨ COSMOS LUXURY</text>
  </g>
</svg>