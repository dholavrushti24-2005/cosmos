<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="700" fill="url(#bgGrad)"/>
  
  <!-- Subtle Aesthetic Geometric Rings -->
  <circle cx="300" cy="310" r="180" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.15"/>
  <circle cx="300" cy="310" r="140" fill="none" stroke="#f43f5e" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.2"/>

  <!-- Category Tag -->
  <g transform="translate(40, 50)">
    <rect width="110" height="32" rx="16" fill="#f43f5e" fill-opacity="0.12"/>
    <text x="55" y="21" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#f43f5e" letter-spacing="1.5" text-anchor="middle" text-transform="uppercase">Beauty</text>
  </g>

  <!-- Central Card & Vector Artwork -->
  <g filter="url(#shadow)" transform="translate(100, 120)">
    <rect width="400" height="380" rx="28" fill="#ffffff" fill-opacity="0.85"/>
    <g transform="translate(200, 190)">
      <ellipse cx="0" cy="55" rx="55" ry="25" fill="#f43f5e" opacity="0.4"/>
    <path d="M-50,0 C-50,55 50,55 50,0 Z" fill="#fda4af" stroke="#f43f5e" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="50" ry="18" fill="#ffe4e6" stroke="#f43f5e" stroke-width="3"/>
    <ellipse cx="0" cy="-10" rx="54" ry="18" fill="#e11d48" stroke="#be123c" stroke-width="3"/>
    <rect x="-42" y="10" width="84" height="25" rx="4" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="27" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#e11d48" text-anchor="middle">ROSE CLAY</text>
    </g>
  </g>

  <!-- Typography -->
  <text x="300" y="555" font-family="'Poppins', sans-serif" font-size="25" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-0.5">Rose Clay Face Mask</text>
  <text x="300" y="585" font-family="'Poppins', sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">Detoxifying Organic Clay</text>
  
  <!-- Quality Emblem -->
  <g transform="translate(300, 630)">
    <rect x="-90" y="-16" width="180" height="32" rx="16" fill="url(#primaryGrad)"/>
    <text x="0" y="5" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">✨ COSMOS LUXURY</text>
  </g>
</svg>