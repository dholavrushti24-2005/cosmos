<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="petalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c26"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="20" fill="url(#petalBg)"/>
  <!-- Flower Petals Motif -->
  <g transform="translate(200,85)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#petalGrad)" stroke-width="1.5" opacity="0.3"/>
    <ellipse cx="0" cy="-18" rx="8" ry="16" fill="url(#petalGrad)" opacity="0.85"/>
    <ellipse cx="0" cy="18" rx="8" ry="16" fill="url(#petalGrad)" opacity="0.85"/>
    <ellipse cx="-18" cy="0" rx="16" ry="8" fill="url(#petalGrad)" opacity="0.85"/>
    <ellipse cx="18" cy="0" rx="16" ry="8" fill="url(#petalGrad)" opacity="0.85"/>
    <circle cx="0" cy="0" r="6" fill="#fef3c7"/>
  </g>
  <!-- Typography -->
  <text x="200" y="160" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="4" text-anchor="middle">PETAL STUDIO</text>
  <text x="200" y="186" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#fb923c" letter-spacing="3" text-anchor="middle">HANDCRAFTED LUXURY</text>
  <line x1="130" y1="202" x2="270" y2="202" stroke="#fb923c" stroke-width="1" stroke-opacity="0.4"/>
</svg>