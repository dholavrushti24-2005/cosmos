<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Cosmos Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebarMount"></aside>

    <div class="content">
      <div class="topbar" id="topbarMount"></div>

      <div class="cards-grid">
        <div class="summary-card"><span>Total Products</span><strong id="statProducts">—</strong></div>
        <div class="summary-card"><span>Total Users</span><strong id="statUsers">—</strong></div>
        <div class="summary-card">
          <span>Total Orders</span>
          <strong id="statOrders">—</strong>
          <div id="orderBreakdown" style="font-size:0.85rem; color:var(--muted); margin-top:0.3rem;"></div>
        </div>
      </div>

      <div class="panel">
        <h3>Recent Orders</h3>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Price</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="recentOrdersBody">
              <tr><td colspan="5" style="color:var(--muted);">Loading...</td></tr>
            </tbody>
          </table>
        </div>
        <div class="empty-state hidden" id="emptyState">
          <div class="icon">📦</div>
          <p>No orders yet.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
