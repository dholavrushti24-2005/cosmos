<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — Cosmos Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .status-select {
      padding: 0.4rem 1.8rem 0.4rem 0.8rem;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1.5px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23f5f2fa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
      background-repeat: no-repeat;
      background-position: right 0.6rem center;
      background-size: 0.8rem;
    }
    .status-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(157, 78, 221, 0.2);
    }
    .status-select option {
      background: #120c21;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebarMount"></aside>

    <div class="content">
      <div class="topbar" id="topbarMount"></div>

      <div class="panel">
        <div class="table-toolbar" style="display:flex; gap:1rem;">
          <input type="search" id="searchInput" placeholder="Search by customer or order ID..." style="flex:1;" />
          <select id="statusFilter" class="status-select">
            <option value="ALL">All Status</option>
            <option value="PENDING">Pending</option>
            <option value="PROCESSING">Processing</option>
            <option value="SHIPPED">Shipped</option>
            <option value="DELIVERED">Delivered</option>
            <option value="CANCELLED">Cancelled</option>
          </select>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Price</th>
                <th>Payment</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr><td colspan="6" style="color:var(--muted);">Loading...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="empty-state hidden" id="emptyState">
          <div class="icon">📦</div>
          <p>No orders found.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
