<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fashion Accessories & Footwear — Cosmos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/shop.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="page-main">
    <div class="container">

      <div class="section-heading">
        <h2>Fashion Accessories & Shoes</h2>
        <p>Explore handbags, evening clutches, stiletto heels, sandals, and eyewear.</p>
      </div>

      <div class="boutique-filter-bar">
        <div class="search-box">
          <input type="search" id="searchInput" placeholder="Search purses, heels, sandals, sunglasses..." />
        </div>
      </div>

      <div class="product-grid" id="productGrid" data-category="fashion">
        <!-- populated from backend/products filtered to category=fashion -->
      </div>

      <div class="empty-state hidden" id="emptyState">
        <div class="icon">👜</div>
        <p>No fashion accessories or shoes found matching your search.</p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/product-card.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
