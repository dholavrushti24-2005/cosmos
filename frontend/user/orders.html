<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — Cosmos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/shop.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="page-main">
    <div class="container">
      <div class="section-heading">
        <h2>My Orders</h2>
        <p>Track and review your past orders.</p>
      </div>

      <div class="list" id="ordersList">
        <!-- populated in Phase 7 from backend/orders -->
      </div>

      <div class="empty-state hidden" id="emptyState">
        <div class="icon">📦</div>
        <p>You haven't placed any orders yet.</p>
        <a href="shop.html" class="primary-btn" style="display:inline-block; margin-top:1rem;">Start Shopping</a>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
